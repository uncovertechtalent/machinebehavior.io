<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Map of the Work: Machine Behavior</title>
<meta name="description" content="Stefan Coetzee's published work as a graph: every page on machinebehavior.io, tychat.io and uncovertechtalent.com, the Substack posts, repos and threads, and the links between them.">
<link rel="canonical" href="https://machinebehavior.io/map/">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛋️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<style>
  :root {
    --bg: #0A0C0F; --panel: rgba(18,22,27,0.88); --line: #1E252D; --ink: #F2F1EC; --dim: #7D8792;
    --amber: #FFB547; --pass: #3DDC97; --blue: #6FA8FF; --pink: #FF8FD8; --fold: #FF4D5E; --ivory: #EFE6D2;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); overflow: hidden;
    font-family: 'Space Grotesk', system-ui, sans-serif; }
  canvas { display: block; cursor: grab; }
  canvas.dragging { cursor: grabbing; }
  .panel { position: fixed; left: 16px; top: 16px; width: 300px; max-width: calc(100vw - 32px); background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 16px 18px; backdrop-filter: blur(6px); }
  .eyebrow { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 3px; color: var(--dim); text-transform: uppercase; }
  h1 { margin: 6px 0 4px; font-size: 26px; line-height: 1.05; letter-spacing: -0.5px; }
  .sub { font-size: 13px; color: var(--dim); line-height: 1.4; margin-bottom: 12px; }
  .stats { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink); margin-bottom: 12px; }
  .stats b { color: var(--amber); }
  input[type=search] { width: 100%; background: #0E1216; border: 1px solid var(--line); border-radius: 8px; color: var(--ink);
    padding: 8px 10px; font-family: 'JetBrains Mono', monospace; font-size: 13px; margin-bottom: 12px; outline: none; }
  input[type=search]:focus { border-color: var(--amber); }
  .filters { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 10px; margin-bottom: 10px; }
  label.f { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; user-select: none; }
  label.f input { display: none; }
  .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
  label.f.off { color: var(--dim); }
  label.f.off .dot { background: transparent !important; border: 1px solid var(--dim); }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; cursor: pointer; color: var(--dim); }
  .toggle input { accent-color: var(--amber); }
  .collapse { position: absolute; right: 12px; top: 12px; background: none; border: 0; color: var(--dim); font-size: 18px; cursor: pointer; }
  .panel.min .body { display: none; }
  .tip { position: fixed; pointer-events: none; background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 10px 12px; max-width: 320px; font-size: 14px; line-height: 1.3; display: none; }
  .k { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; margin-top: 4px; }
  .foot a { color: var(--dim); }
  .foot { position: fixed; right: 16px; bottom: 12px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--dim); text-align: right; }
  /* preview sheet */
  .sheet { position: fixed; left: 50%; bottom: 0; z-index: 10; width: min(1120px, calc(100vw - 32px)); height: 74vh;
    display: flex; flex-direction: column; background: #0E1216; border: 1px solid var(--line); border-bottom: 0;
    border-radius: 14px 14px 0 0; box-shadow: 0 -24px 70px rgba(0,0,0,0.6); visibility: hidden;
    transform: translate(-50%, 104%); transition: transform .42s cubic-bezier(.2,.8,.2,1), visibility 0s linear .42s; }
  .sheet.open { transform: translate(-50%, 0); visibility: visible; transition: transform .42s cubic-bezier(.2,.8,.2,1); }
  .sheet.drag { transition: none; }
  .sheet-bar { display: flex; align-items: center; gap: 12px; padding: 16px 14px 11px 18px; border-bottom: 1px solid var(--line);
    position: relative; cursor: grab; touch-action: none; }
  .sheet-bar::before { content: ''; position: absolute; top: 6px; left: 50%; width: 42px; height: 4px; margin-left: -21px;
    border-radius: 2px; background: #2A333D; }
  .s-meta { flex: 1; min-width: 0; }
  .s-title { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .s-btn { font-family: 'JetBrains Mono', monospace; font-size: 12px; color: var(--ink); background: none; border: 1px solid var(--line);
    border-radius: 8px; padding: 7px 11px; cursor: pointer; text-decoration: none; white-space: nowrap; }
  .s-btn:hover, .s-btn:focus-visible { border-color: var(--amber); color: var(--amber); outline: none; }
  .sheet-body { position: relative; flex: 1; min-height: 0; }
  .sheet-body iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .3s; }
  .sheet-body iframe.ready { opacity: 1; }
  .s-load { position: absolute; inset: 0; display: none; place-items: center; font-family: 'JetBrains Mono', monospace;
    font-size: 12px; letter-spacing: 2px; color: var(--dim); text-transform: uppercase; }
  .s-load.on { display: grid; }
  .s-load::before { content: ''; position: absolute; top: 0; left: 0; height: 2px; width: 30%; background: var(--amber);
    animation: sweep 1.1s ease-in-out infinite; }
  @keyframes sweep { from { left: -30%; } to { left: 100%; } }
  .s-card { position: absolute; inset: 0; overflow: auto; padding: 26px 28px 40px; display: none; }
  .s-card.on { display: block; }
  .s-card h2 { margin: 6px 0 10px; font-size: 26px; line-height: 1.12; letter-spacing: -0.4px; max-width: 760px; }
  .s-card p { color: #C9CDD2; font-size: 16px; line-height: 1.5; max-width: 680px; margin: 0 0 18px; }
  .s-cta { display: inline-block; background: var(--amber); color: #0A0C0F; font-weight: 700; text-decoration: none;
    border-radius: 9px; padding: 10px 16px; font-size: 14px; margin-bottom: 26px; }
  .s-near { list-style: none; padding: 0; margin: 10px 0 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 6px 18px; }
  .s-near button { display: flex; gap: 9px; align-items: center; width: 100%; background: none; border: 0; color: var(--ink);
    text-align: left; font: 500 14px 'Space Grotesk', sans-serif; padding: 5px 0; cursor: pointer; }
  .s-near button:hover { color: var(--amber); }
  .s-near span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  @media (max-width: 600px) { .sheet { width: 100vw; height: 86vh; } .sheet-bar { padding-left: 14px; } .s-card { padding: 20px 16px 32px; }
    .s-card h2 { font-size: 22px; } }
  @media (prefers-reduced-motion: reduce) { .sheet, .sheet.open { transition: none; } .s-load::before { animation: none; } }
  @media (max-width: 600px) { .panel { width: auto; right: 16px; } .filters { grid-template-columns: 1fr 1fr; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="panel" id="panel">
  <button class="collapse" id="collapse" aria-label="Collapse panel">–</button>
  <div class="eyebrow"><a href="/" style="color:inherit;text-decoration:none">machinebehavior.io</a></div>
  <h1>Map of the Work</h1>
  <div class="eyebrow" style="margin-bottom:8px">Stefan Coetzee</div>
  <div class="body">
    <div class="sub">Every published page, post, repo and thread, and the links between them. Hover to see neighbours, click to read, drag to rearrange.</div>
    <div class="stats" id="stats"></div>
    <input type="search" id="q" placeholder="Search titles" autocomplete="off">
    <div class="filters" id="filters"></div>
    <label class="toggle"><input type="checkbox" id="nav"> Show navigation links</label>
  </div>
</div>
<div class="tip" id="tip"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="false" aria-labelledby="s-title" aria-hidden="true">
  <div class="sheet-bar" id="s-bar">
    <span class="dot" id="s-dot"></span>
    <div class="s-meta"><div class="s-title" id="s-title"></div><div class="k" id="s-kind"></div></div>
    <a class="s-btn" id="s-open" target="_blank" rel="noopener">Open ↗</a>
    <button class="s-btn" id="s-close" aria-label="Close preview">✕</button>
  </div>
  <div class="sheet-body" id="s-body">
    <div class="s-load" id="s-load"></div>
    <div class="s-card" id="s-card"></div>
  </div>
</section>
<div class="foot"><span id="foot"></span><br><span class="conf mono" data-conformity>conformity: <a class="mono" href="/conformity/" style="color:inherit">latest run</a></span> · <a href="/map/graph.json" style="color:inherit">graph.json</a></div>
<noscript><p style="padding:24px;max-width:640px">Map of the Work is an interactive graph of Stefan Coetzee's published work across machinebehavior.io, tychat.io, uncovertechtalent.com, Substack, GitHub and Reddit. The data is at <a href="/map/graph.json">/map/graph.json</a>; the index for models is at <a href="/llms.txt">/llms.txt</a>.</p></noscript>
<script src="/conformity/footer.js" defer></script>
<script>
const KINDS = [
  {key: 'mb', label: 'machinebehavior.io', color: '#FFB547'},
  {key: 'tychat', label: 'tychat.io', color: '#3DDC97'},
  {key: 'utt', label: 'uncovertechtalent', color: '#6FA8FF'},
  {key: 'substack', label: 'Substack', color: '#FF8FD8'},
  {key: 'github', label: 'GitHub', color: '#EFE6D2'},
  {key: 'reddit', label: 'Reddit', color: '#FF4D5E'},
  {key: 'tag', label: 'Tags', color: '#7D8792'},
];
const COLOR = Object.fromEntries(KINDS.map(k => [k.key, k.color]));
const groupOf = n => n.kind === 'tag' ? 'tag' : n.site;
const on = Object.fromEntries(KINDS.map(k => [k.key, true]));
let showNav = false, query = '', hover = null, selected = null;

const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1; W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * DPR; canvas.height = H * DPR; canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
}
resize();

fetch('/map/graph.json').then(r => r.json()).then(g => {
  const nodes = g.nodes.map(n => ({...n}));
  const byId = new Map(nodes.map(n => [n.id, n]));
  const allLinks = g.links.filter(l => byId.has(l.source) && byId.has(l.target)).map(l => ({...l}));
  // degree on body links drives size
  for (const n of nodes) n.deg = 0;
  for (const l of allLinks) if (l.kind === 'body') { byId.get(l.source).deg++; byId.get(l.target).deg++; }
  for (const n of nodes) n.r = 2.5 + Math.sqrt(n.deg) * 1.6;
  document.getElementById('foot').textContent = `crawled ${g.generated} · ${nodes.length} nodes · drag, scroll to zoom`;

  // filters UI
  const fwrap = document.getElementById('filters');
  for (const k of KINDS) {
    const count = nodes.filter(n => groupOf(n) === k.key).length;
    if (!count) continue;
    const lab = document.createElement('label'); lab.className = 'f';
    lab.innerHTML = `<input type="checkbox" checked><span class="dot" style="background:${k.color}"></span>${k.label} <span style="color:var(--dim);font-family:'JetBrains Mono';font-size:11px">${count}</span>`;
    lab.onclick = (e) => { e.preventDefault(); on[k.key] = !on[k.key]; lab.classList.toggle('off', !on[k.key]); restart(); };
    fwrap.appendChild(lab);
  }
  document.getElementById('nav').onchange = e => { showNav = e.target.checked; restart(); };
  document.getElementById('q').oninput = e => { query = e.target.value.trim().toLowerCase(); draw(); };
  const setPanel = open => {
    document.getElementById('panel').classList.toggle('min', !open);
    document.getElementById('collapse').textContent = open ? '–' : '+';
  };
  document.getElementById('collapse').onclick = () => setPanel(document.getElementById('panel').classList.contains('min'));

  let vis = [], links = [], neigh = new Map();
  const sim = d3.forceSimulation()
    .force('charge', d3.forceManyBody().strength(n => -70 - n.r * 14).distanceMax(700))
    .force('link', d3.forceLink().id(n => n.id).distance(l => l.kind === 'nav' ? 120 : 34 + 9 * Math.sqrt((l.source.deg || 1) + (l.target.deg || 1))).strength(l => l.kind === 'nav' ? 0.02 : 0.18))
    .force('x', d3.forceX(0).strength(n => n.deg ? 0.025 : 0.12))
    .force('y', d3.forceY(0).strength(n => n.deg ? 0.03 : 0.12))
    .force('collide', d3.forceCollide(n => n.r + 4))
    .on('tick', () => { draw(); if (!fitted && ++ticks >= 260) { fitted = true; fit(); setTimeout(openFromHash, 950); } })
    .on('end', () => { if (!fitted) { fitted = true; fit(); setTimeout(openFromHash, 950); } });
  let fitted = false, ticks = 0;
  function fit() {
    if (!vis.length) return;
    const core = vis.filter(n => neigh.get(n.id).size > 0);
    const q = (arr, p) => arr.slice().sort((a, b) => a - b)[Math.floor(p * (arr.length - 1))];
    const xs = core.map(n => n.x), ys = core.map(n => n.y);
    const x0 = q(xs, 0.02), x1 = q(xs, 0.98), y0 = q(ys, 0.02), y1 = q(ys, 0.98);
    const left = W > 900 ? 340 : 0, top = W > 900 ? 0 : 120;
    const k = Math.min(3, 0.92 * Math.min((W - left - 40) / (x1 - x0 + 1), (H - top - 60) / (y1 - y0 + 1)));
    const tx = left + (W - left) / 2 - k * (x0 + x1) / 2, ty = top + (H - top) / 2 - k * (y0 + y1) / 2;
    d3.select(canvas).transition().duration(900).call(zoom.transform, d3.zoomIdentity.translate(tx, ty).scale(k));
  }

  function restart() {
    vis = nodes.filter(n => on[groupOf(n)]);
    const vset = new Set(vis.map(n => n.id));
    links = allLinks.filter(l => (showNav || l.kind === 'body') &&
      vset.has(typeof l.source === 'object' ? l.source.id : l.source) &&
      vset.has(typeof l.target === 'object' ? l.target.id : l.target));
    neigh = new Map(vis.map(n => [n.id, new Set()]));
    for (const l of links) {
      const s = l.source.id || l.source, t = l.target.id || l.target;
      neigh.get(s).add(t); neigh.get(t).add(s);
    }
    sim.nodes(vis); sim.force('link').links(links);
    sim.alpha(0.6).restart();
    const body = links.filter(l => l.kind === 'body').length;
    document.getElementById('stats').innerHTML = `<b>${vis.length}</b> nodes · <b>${body}</b> links${showNav ? ` · ${links.length - body} navigation` : ''}`;
  }

  // view transform
  let t = d3.zoomIdentity.translate(W / 2, H / 2).scale(window.innerWidth < 600 ? 0.4 : 0.7);
  const zoom = d3.zoom().scaleExtent([0.2, 6])
    .filter(e => e.type === 'wheel' || (!e.button && !nodeAt(...pt(e))))
    .on('zoom', e => { t = e.transform; draw(); });
  d3.select(canvas).call(zoom).call(zoom.transform, t);

  function nodeAt(px, py) {
    const [x, y] = t.invert([px, py]);
    let best = null, bd = Infinity;
    for (const n of vis) { const d = Math.hypot(n.x - x, n.y - y); if (d < n.r + 6 / t.k && d < bd) { bd = d; best = n; } }
    return best;
  }

  function draw() {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = '#0A0C0F'; ctx.fillRect(0, 0, W, H);
    ctx.translate(t.x, t.y); ctx.scale(t.k, t.k);
    const focus = hover || selected;
    const hl = focus ? neigh.get(focus.id) || new Set() : null;
    const match = query ? new Set(vis.filter(n => n.title.toLowerCase().includes(query)).map(n => n.id)) : null;
    const lit = n => (!focus || n === focus || hl.has(n.id)) && (!match || match.has(n.id));
    // links
    for (const l of links) {
      const a = l.source, b = l.target;
      const active = focus && (a === focus || b === focus);
      const dimmed = (focus && !active) || (match && !(match.has(a.id) || match.has(b.id)));
      ctx.strokeStyle = active ? COLOR[groupOf(focus)] : l.kind === 'nav' ? 'rgba(150,160,172,0.20)' : 'rgba(196,204,214,0.36)';
      ctx.globalAlpha = dimmed ? 0.25 : 1;
      ctx.lineWidth = (active ? 1.6 : 0.9) / Math.sqrt(t.k);
      ctx.beginPath(); ctx.moveTo(a.x, a.y); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    // nodes
    for (const n of vis) {
      const isLit = lit(n);
      ctx.globalAlpha = isLit ? 1 : 0.15;
      ctx.fillStyle = COLOR[groupOf(n)];
      ctx.beginPath(); ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2); ctx.fill();
      if (n === selected) { ctx.strokeStyle = '#FFB547'; ctx.lineWidth = 2 / t.k; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 5 / t.k, 0, Math.PI * 2); ctx.stroke(); }
      if (n === hover) { ctx.strokeStyle = '#F2F1EC'; ctx.lineWidth = 1.5 / t.k; ctx.beginPath(); ctx.arc(n.x, n.y, n.r + 3 / t.k, 0, Math.PI * 2); ctx.stroke(); }
    }
    // labels: biggest first, skip any that would collide on screen
    ctx.textAlign = 'center'; ctx.textBaseline = 'top';
    const placed = [];
    const rank = n => n === focus ? 3 : (match && match.has(n.id)) ? 2 : (focus && hl.has(n.id)) ? 1 : 0;
    const order = vis.slice().sort((a, b) => rank(b) - rank(a) || b.r - a.r);
    for (const n of order) {
      const forced = n === focus || (match && match.has(n.id));
      const show = forced || (focus && hl.has(n.id)) || n.r * t.k > 7 || t.k > 2.2;
      if (!show || (!lit(n) && !(match && match.has(n.id)))) continue;
      const px = 11 + Math.min(4, n.r * 0.25);
      ctx.font = `${n === focus ? 700 : 500} ${px / t.k}px 'Space Grotesk', sans-serif`;
      const label = n.title.length > 46 ? n.title.slice(0, 44) + '…' : n.title;
      const wS = ctx.measureText(label).width * t.k, [sx, sy] = t.apply([n.x, n.y + n.r]);
      const box = {x0: sx - wS / 2 - 3, x1: sx + wS / 2 + 3, y0: sy + 2, y1: sy + px + 6};
      if (!forced && placed.some(b => box.x0 < b.x1 && b.x0 < box.x1 && box.y0 < b.y1 && b.y0 < box.y1)) continue;
      placed.push(box);
      ctx.globalAlpha = 1;
      ctx.lineWidth = 3 / t.k; ctx.strokeStyle = '#0A0C0F'; ctx.strokeText(label, n.x, n.y + n.r + 3 / t.k);
      ctx.fillStyle = n === focus ? '#F2F1EC' : 'rgba(242,241,236,0.82)'; ctx.fillText(label, n.x, n.y + n.r + 3 / t.k);
    }
    ctx.globalAlpha = 1;
  }

  // interaction: hover, click, drag
  const tip = document.getElementById('tip');
  const kindLabel = Object.fromEntries(KINDS.map(k => [k.key, k.label]));
  canvas.addEventListener('mousemove', e => {
    if (dragging) return;
    const n = nodeAt(e.offsetX, e.offsetY);
    if (n !== hover) { hover = n; draw(); }
    if (n) {
      tip.style.display = 'block';
      tip.innerHTML = `<div>${n.title}</div><div class="k">${kindLabel[groupOf(n)]} · ${neigh.get(n.id).size} linked</div>`;
      const x = Math.min(e.clientX + 14, window.innerWidth - tip.offsetWidth - 8);
      tip.style.left = x + 'px'; tip.style.top = (e.clientY + 14) + 'px';
      canvas.style.cursor = 'pointer';
    } else { tip.style.display = 'none'; canvas.style.cursor = 'grab'; }
  });
  canvas.addEventListener('mouseleave', () => { hover = null; tip.style.display = 'none'; draw(); });
  let dragging = null, moved = false;
  const pt = e => (e.touches ? d3.pointers(e, canvas)[0] : d3.pointer(e, canvas)) || [NaN, NaN];
  d3.select(canvas).call(d3.drag()
    .container(canvas)
    .filter(e => !e.button && !!nodeAt(...pt(e)))
    .subject(e => { const n = nodeAt(e.x, e.y); return n ? {node: n, x: e.x, y: e.y} : null; })
    .on('start', e => { const n = e.subject.node; dragging = n; moved = false; canvas.classList.add('dragging');
      sim.alphaTarget(0.25).restart(); n.fx = n.x; n.fy = n.y; })
    .on('drag', e => { moved = true; const [x, y] = t.invert([e.x, e.y]); const n = e.subject.node; n.fx = x; n.fy = y; })
    .on('end', e => { const n = e.subject.node; canvas.classList.remove('dragging'); sim.alphaTarget(0); n.fx = null; n.fy = null;
      if (!moved) openSheet(n); dragging = null; }));
  canvas.addEventListener('click', e => { if (selected && !nodeAt(e.offsetX, e.offsetY)) closeSheet(); });

  // preview sheet: our own sites load in a frame; Substack, GitHub and Reddit refuse framing, so they get a card
  const FRAMEABLE = new Set(['machinebehavior.io', 'tychat.io', 'uncovertechtalent.com']);
  const SITE_NAME = {mb: 'machinebehavior.io', tychat: 'tychat.io', utt: 'uncovertechtalent.com', substack: 'Substack', github: 'GitHub', reddit: 'Reddit'};
  const sheet = document.getElementById('sheet'), sBody = document.getElementById('s-body'), sLoad = document.getElementById('s-load'),
    sCard = document.getElementById('s-card'), sOpen = document.getElementById('s-open');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
  const isMapPage = id => { try { const u = new URL(id); return u.hostname === 'machinebehavior.io' && u.pathname === '/map/'; } catch { return false; } };
  let frame = null, panelWasOpen = false;
  function openSheet(n, fromHash) {
    selected = n; hover = null; tip.style.display = 'none';
    const host = new URL(n.id).hostname.replace(/^www\./, '');
    document.getElementById('s-dot').style.background = COLOR[groupOf(n)];
    document.getElementById('s-title').textContent = n.title;
    document.getElementById('s-kind').textContent = `${kindLabel[groupOf(n)]} · ${neigh.get(n.id)?.size || 0} linked`;
    sOpen.href = n.id;
    if (frame) { frame.remove(); frame = null; }  // a fresh frame each time keeps the page history clean
    sCard.classList.remove('on'); sLoad.classList.remove('on');
    if (FRAMEABLE.has(host) && !isMapPage(n.id)) {
      sLoad.textContent = `loading ${host}`; sLoad.classList.add('on');
      frame = document.createElement('iframe');
      frame.title = n.title; frame.referrerPolicy = 'strict-origin-when-cross-origin';
      frame.addEventListener('load', () => { sLoad.classList.remove('on'); frame && frame.classList.add('ready'); });
      frame.src = n.id; sBody.appendChild(frame);
    } else {
      const near = [...(neigh.get(n.id) || [])].map(id => byId.get(id)).filter(Boolean).sort((a, b) => b.deg - a.deg);
      const why = isMapPage(n.id) ? 'This page.' : `${SITE_NAME[n.site] || host} does not allow its pages inside other sites, so here is the summary.`;
      sCard.innerHTML = `<div class="eyebrow">${esc(why)}</div><h2>${esc(n.title)}</h2>` +
        (n.desc ? `<p>${esc(n.desc)}</p>` : '') +
        (isMapPage(n.id) ? '' : `<a class="s-cta" target="_blank" rel="noopener">Read on ${esc(SITE_NAME[n.site] || host)} ↗</a>`) +
        (near.length ? `<div class="eyebrow">Linked in the map · ${near.length}</div><ul class="s-near">` +
          near.map(m => `<li><button data-id="${esc(m.id)}"><span class="dot" style="background:${COLOR[groupOf(m)]}"></span><span class="t">${esc(m.title)}</span></button></li>`).join('') + '</ul>' : '');
      const cta = sCard.querySelector('.s-cta'); if (cta) cta.href = n.id;
      sCard.classList.add('on'); sCard.scrollTop = 0;
    }
    const wasOpen = sheet.classList.contains('open');
    const panel = document.getElementById('panel');
    if (!wasOpen) { panelWasOpen = !panel.classList.contains('min'); setPanel(false); }
    sheet.classList.add('open'); sheet.setAttribute('aria-hidden', 'false');
    if (!wasOpen) document.getElementById('s-close').focus({preventScroll: true});
    history.replaceState(null, '', '#open=' + encodeURIComponent(n.id));
    centreOn(n); draw();
  }
  function closeSheet() {
    if (!sheet.classList.contains('open')) return;
    sheet.classList.remove('open'); sheet.setAttribute('aria-hidden', 'true');
    selected = null; history.replaceState(null, '', location.pathname + location.search);
    if (panelWasOpen) setPanel(true);
    setTimeout(() => { if (!sheet.classList.contains('open') && frame) { frame.remove(); frame = null; } }, 450);
    draw();
  }
  // pan so the chosen node sits in the middle of the strip of graph left above the sheet
  function centreOn(n) {
    if (n.x == null) return;
    const sheetH = sheet.getBoundingClientRect().height || H * 0.74;
    const left = W > 900 ? 340 : 0;
    const sx = left + (W - left) / 2, sy = Math.max(60, (H - sheetH) / 2);
    d3.select(canvas).transition().duration(600).call(zoom.transform, d3.zoomIdentity.translate(sx - t.k * n.x, sy - t.k * n.y).scale(t.k));
  }
  sCard.addEventListener('click', e => { const b = e.target.closest('button[data-id]'); if (b && byId.get(b.dataset.id)) openSheet(byId.get(b.dataset.id)); });
  document.getElementById('s-close').onclick = closeSheet;
  window.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet(); });
  // pull the bar down to close
  const bar = document.getElementById('s-bar'); let pull = null;
  bar.addEventListener('pointerdown', e => { if (e.target.closest('a,button')) return; pull = {y: e.clientY, id: e.pointerId}; bar.setPointerCapture(e.pointerId); sheet.classList.add('drag'); });
  bar.addEventListener('pointermove', e => { if (!pull) return; const dy = Math.max(0, e.clientY - pull.y); sheet.style.transform = `translate(-50%, ${dy}px)`; });
  const endPull = e => { if (!pull) return; const dy = e.clientY - pull.y; pull = null; sheet.classList.remove('drag'); sheet.style.transform = ''; if (dy > 90) closeSheet(); };
  bar.addEventListener('pointerup', endPull); bar.addEventListener('pointercancel', endPull);
  window.addEventListener('hashchange', () => openFromHash());
  function openFromHash() {
    const m = location.hash.match(/^#open=(.+)$/); if (!m) return closeSheet();
    const n = byId.get(decodeURIComponent(m[1])); if (n && n !== selected) openSheet(n, true);
  }
  window.addEventListener('resize', () => { resize(); draw(); });
  if (window.innerWidth < 600) setPanel(false);
  restart();
});
</script>
</body>
</html>
