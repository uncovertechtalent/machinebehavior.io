name: Conformity checks (site tier)
description: Runs the continuous-conformity site-tier checks over a static site's published pages and renders the /conformity/ page.
inputs:
  root:
    description: Site root to scan (the served tree; for Hugo, the build output)
    required: true
  config:
    description: Path to the site's site-tier.json
    required: true
  requirements:
    description: Path to requirements.json
    required: true
  out:
    description: Directory for latest.json, index.html, runs/ and .result
    required: true
  git-dir:
    description: Repository directory for commit metadata when root is a build output
    required: false
    default: "."
  trigger:
    description: Trigger name (push, schedule, workflow_dispatch, manual)
    required: false
    default: ${{ github.event_name }}
  sha:
    description: Commit under test
    required: false
    default: ${{ github.sha }}
  runner:
    description: Runner image label for the run record
    required: false
    default: ubuntu-latest
runs:
  using: composite
  steps:
    - name: Run the checks
      shell: bash
      # The inputs reach run.py through the environment, never through ${{ }} inside the script, so an
      # input that carries event data cannot inject shell code (zizmor template-injection, #65).
      env:
        ACTION_PATH: ${{ github.action_path }}
        CC_ROOT: ${{ inputs.root }}
        CC_CONFIG: ${{ inputs.config }}
        CC_REQUIREMENTS: ${{ inputs.requirements }}
        CC_OUT: ${{ inputs.out }}
        CC_GIT_DIR: ${{ inputs['git-dir'] }}
        CC_TRIGGER: ${{ inputs.trigger }}
        CC_SHA: ${{ inputs.sha }}
        CC_RUNNER: ${{ inputs.runner }}
      run: |
        python3 "$ACTION_PATH/run.py" --root "$CC_ROOT" --config "$CC_CONFIG" --requirements "$CC_REQUIREMENTS" --out "$CC_OUT" --git-dir "$CC_GIT_DIR" --trigger "$CC_TRIGGER" --sha "$CC_SHA" --runner "$CC_RUNNER"
    - name: Upload the run record
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: conformity-run-${{ github.run_id }}
        path: ${{ inputs.out }}/runs/*.json
        retention-days: 90
