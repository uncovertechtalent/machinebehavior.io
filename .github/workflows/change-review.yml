name: Change review

# Reviews each pull request with /sdlc:change-review from the CTO powersuit and posts the review as
# one comment, which later runs on the same pull request update in place (#65).
#
# - No new action owner: Claude Code installs with npm ci from .github/claude-code/package-lock.json
#   (tarball hashes pinned), so actions.owners stays at "actions". The sdlc plugin comes from a fixed
#   commit of uncovertechtalent/cto-powersuit (SUIT_SHA below), fetched without credentials. Dependabot
#   moves the Claude Code pin; the gate owner moves SUIT_SHA by hand.
# - Two jobs. "review" runs Claude Code with read-only tools and a read-only token and writes the
#   review as structured output; it cannot post, push or edit. Claude Code runs with --restricted: no
#   settings file loads, so the pull request's .claude/ settings and hooks never run; Read, Grep and
#   Glob are confined to the checkout and Claude Code's own spill folder, so /proc (where the token
#   sits in the process environment) is out of reach; and Bash runs only the gh commands allowed
#   below. --strict-mcp-config starts no MCP server. The deny list stays as a second layer.
#   "comment" posts the review after a check for token-shaped strings, with no checkout, no secret
#   and no model.
# - Context is public only: the ADRs, the engineering docs, CLAUDE.md, the gate's README and config,
#   /man/, /llms.txt and the linked issue. A private knowledge base never reaches this job; the review
#   with private context runs on the owner's machine (`claude "/sdlc:change-review <n> kb"`).
# - Pull requests from forks and from bots, and drafts, are skipped. The token is the repository
#   secret CLAUDE_CODE_OAUTH_TOKEN (from `claude setup-token`); without it the review job skips its
#   steps and passes, and no comment is posted. Not a required check.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: change-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    name: Change review
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && !github.event.pull_request.draft
      && !endsWith(github.actor, '[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read        # check out the merge result
      pull-requests: read   # gh pr view and gh pr diff
      issues: read          # gh issue view for the issue the pull request links
    outputs:
      result: ${{ steps.claude.outputs.result }}
    env:
      SUIT_SHA: 93678455d1dad6d1a527ebe27727fdbc8e2a2b7c  # uncovertechtalent/cto-powersuit main at 2026-10-12, sdlc 0.2.1
    steps:
      - name: Check for the token
        id: token
        env:
          TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set, so the change review is skipped."
          fi

      - name: Checkout
        if: steps.token.outputs.present == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: The sdlc plugin at a fixed commit of the CTO powersuit
        if: steps.token.outputs.present == 'true'
        run: |
          set -euo pipefail
          git init -q "$RUNNER_TEMP/suit"
          git -C "$RUNNER_TEMP/suit" fetch -q --depth 1 https://github.com/uncovertechtalent/cto-powersuit.git "$SUIT_SHA"
          git -C "$RUNNER_TEMP/suit" checkout -q FETCH_HEAD
          test "$(git -C "$RUNNER_TEMP/suit" rev-parse HEAD)" = "$SUIT_SHA"

      - name: Install Claude Code (version and tarball hashes pinned in .github/claude-code/package-lock.json)
        if: steps.token.outputs.present == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/claude-code"
          cp .github/claude-code/package.json .github/claude-code/package-lock.json "$RUNNER_TEMP/claude-code/"
          npm ci --prefix "$RUNNER_TEMP/claude-code" --no-audit --no-fund

      - name: Review with /sdlc:change-review
        id: claude
        if: steps.token.outputs.present == 'true'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/prompt.md" <<'PROMPT'
          /sdlc:change-review

          Review pull request #@PR@ in @REPO@. The merge result of the pull request is checked out in the working directory.

          Context first. Before the diff, read this repository's own record of its decisions and conventions:
          - The decision records scripts/docs/eng/adr-*.md. Read the ones whose title or summary matches a changed path or topic, and respect `supersedes:` in their front matter (ADR-0010 supersedes ADR-0003 and ADR-0006).
          - The engineering docs in scripts/docs/eng/ that the change touches, such as deploy-pipeline.md, conformity-gate.md, sdlc.md, site-architecture.md, add-a-page.md, and the generated changelog.md.
          - CLAUDE.md, conformity/README.md and conformity/site-tier.json: the gate, its checks and tiers, and the pull request flow.
          - The public pages written for models: man/index.html (/man/) and llms.txt.
          - The issue the pull request links, if any: `gh issue view <number>`.
          Check the change against those records. When a choice you would flag is recorded there, write "intentional per ADR-NNNN" (or the file that records it) as a note, not a finding. Flag it only when the change contradicts the record or the record no longer fits.

          This run is headless in CI and nobody can answer questions:
          - The shell allows three commands, one per call, with no pipes: `gh pr view @PR@` (with `--json title,body,commits,files,additions,deletions` for scope and size), `gh pr diff @PR@`, and `gh issue view <number>`. Read files in the working directory with the Read, Grep and Glob tools.
          - There is no private knowledge base here, and none may be used: ignore `kb`.
          - Read only. Do not run /sdlc:pre-push, the gate, tests, builds or installs. Skip the overlay check: CI has no overlay.
          - Do not post to GitHub. Return the review in the `review` field; the workflow posts it as one comment.
          - Write the review in Markdown: the findings ordered block, should, note, each with file, line and the fix, then one line with the counts. With no findings, say so in one line.
          - The repository is public. Mask any secret you find.
          PROMPT
          sed -i -e "s|@PR@|$PR|g" -e "s|@REPO@|$REPO|g" "$RUNNER_TEMP/prompt.md"
          # Claude Code writes a large tool result (a long diff) to a file under its projects folder and reads it from there.
          mkdir -p "$HOME/.claude/projects"
          "$RUNNER_TEMP/claude-code/node_modules/.bin/claude" -p "$(cat "$RUNNER_TEMP/prompt.md")" \
            --restricted \
            --strict-mcp-config \
            --add-dir "$HOME/.claude/projects" \
            --plugin-dir "$RUNNER_TEMP/suit/plugins/sdlc" \
            --max-turns 40 \
            --tools "Skill,Read,Grep,Glob,Bash" \
            --allowedTools "Skill,Read,Grep,Glob,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh issue view:*)" \
            --disallowedTools "Edit,Write,NotebookEdit,WebFetch,WebSearch,Read(//proc/**),Read(//sys/**),Read(~/runners/**),Read(~/actions-runner/**),Read(~/.ssh/**),Read(~/.config/gh/**),Read(~/.claude/.credentials.json)" \
            --json-schema '{"type":"object","properties":{"review":{"type":"string","description":"The review in Markdown"}},"required":["review"],"additionalProperties":false}' \
            --output-format json < /dev/null > "$RUNNER_TEMP/review.json"
          jq -e '.structured_output.review | type == "string"' "$RUNNER_TEMP/review.json" > /dev/null
          jq '{subtype, num_turns, total_cost_usd, duration_ms}' "$RUNNER_TEMP/review.json"
          # One line of compact JSON: jq escapes the newlines, so the output cannot break out of its line.
          echo "result=$(jq -c '.structured_output' "$RUNNER_TEMP/review.json")" >> "$GITHUB_OUTPUT"

  comment:
    name: Post the review
    needs: review
    if: needs.review.outputs.result != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write  # post or update the review comment
    steps:
      - name: Post or update the review comment
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ needs.review.outputs.result }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # The runner already drops a job output that contains a registered secret. This also stops a
          # review that carries anything shaped like an Anthropic or GitHub token, in any form.
          if jq -r '.review' <<< "$RESULT" | grep -Eq 'sk-ant-[A-Za-z0-9_-]{16,}|gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{30,}'; then
            echo "::error::The review contains a token-shaped string, so it is not posted. Read the review job's log."
            exit 1
          fi
          marker="<!-- machinebehavior:change-review -->"
          {
            echo "$marker"
            echo "## Change review (/sdlc:change-review)"
            echo
            jq -r '.review' <<< "$RESULT"
            echo
            echo "<sub>Commit ${HEAD_SHA:0:7}, [run]($RUN_URL). Written by Claude Code with the CTO powersuit's sdlc plugin, from this repository's public records only. A person approves; this review never does.</sub>"
          } > body.md
          id=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -F body=@body.md > /dev/null
            echo "updated comment $id"
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -F body=@body.md > /dev/null
            echo "posted a new comment"
          fi
