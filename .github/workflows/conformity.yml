name: Conformity

# Continuous conformity, site tier. The checks run on every pull request to main
# (a required check before merge, ADR-0029), on every push to main (before the
# changed site serves readers), on a weekly schedule, and by hand. The Pages
# deploy job depends on the conformity job: a failing check blocks the deploy
# and the previous build stays live. Pull request runs commit nothing and deploy nothing.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

# Each job asks for its own permissions (#65); the workflow grants none.
permissions: {}

concurrency:
  group: conformity-${{ github.ref }}
  cancel-in-progress: false

jobs:
  conformity:
    name: Conformity checks
    runs-on: ubuntu-latest
    permissions:
      contents: write   # the bot commit of latest.json and the page, when the deploy key is missing
    outputs:
      result: ${{ steps.gate.outputs.result }}
    steps:
      - name: Checkout  # zizmor: ignore[artipacked] the bot commit pushes with the persisted deploy key (.github/zizmor.yml)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A pull request run checks the merge result of the pull request; every other run checks main.
          ref: ${{ github.event_name == 'pull_request' && github.ref || 'main' }}
          fetch-depth: 0
          # The bot commit below pushes to main with this deploy key, which the branch rules on main let through
          # (ADR-0029). Without the secret, checkout falls back to the workflow token.
          # Only runs on main get the key: a manual run from a branch is a dry run (#70, ADR-0029).
          ssh-key: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && secrets.CONFORMITY_PUSH_KEY || '' }}

      - name: Run the checks
        uses: $/.github/actions/conformity  # self-repository form (#70): the gate counts $/ as local (run.py pin_refs, #66); actionlint 1.7.12 does not know it yet
        with:
          root: .
          config: conformity/site-tier.json
          requirements: conformity/requirements.json
          out: conformity

      - name: Commit latest.json and the page
        # Only on main: a manual run from a branch runs that branch's gate (uses: $/...) and commits nothing.
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "conformity-bot"
          git config user.email "conformity-bot@users.noreply.github.com"
          git add conformity/latest.json conformity/index.html
          if git diff --cached --quiet; then
            echo "no change to commit"
          else
            # [skip ci] is required: a push with the deploy key starts workflows (the workflow token's push did not),
            # so without it every bot commit would start another run.
            git commit -m "conformity: run $(date -u +%Y-%m-%dT%H:%M:%SZ) (${{ github.event_name }}) [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Gate
        id: gate
        run: |
          result=$(cat conformity/.result)
          echo "result=$result" >> "$GITHUB_OUTPUT"
          echo "overall: $result"
          if [ "$result" != "pass" ]; then
            echo "::error::conformity checks failed; deploy blocked, previous build stays live"
            exit 1
          fi

  deploy:
    name: Deploy to Pages
    needs: conformity
    # Only on main; the github-pages environment also allows deployments from main and gh-pages only.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      contents: read    # check out main after the bot commit
      pages: write      # deploy to Pages
      id-token: write   # the OIDC token deploy-pages needs
      actions: read     # the deploy feed snapshot for Inside
      issues: read      # the issue snapshot for the board
    steps:
      - name: Checkout (after the bot commit)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Refresh the map snapshot (artifact only, never committed)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          cp map/graph.json /tmp/graph.committed.json
          if python3 scripts/crawl_map.py map/graph.json; then
            # Keep the refresh only if it lost nothing: a partial crawl (for example Substack answering 403
            # to the runner) must not replace a fuller committed snapshot.
            if python3 -c "import json,sys; n=json.load(open('map/graph.json')); o=json.load(open('/tmp/graph.committed.json')); print('refreshed nodes', len(n['nodes']), 'links', len(n['links']), '| committed nodes', len(o['nodes']), 'links', len(o['links'])); sys.exit(0 if len(n['nodes']) >= len(o['nodes']) and len(n['links']) >= len(o['links']) else 1)"; then
              echo "map refreshed and deployed"
            else
              echo "::warning::map crawl returned fewer nodes or links than the committed snapshot; the committed snapshot is deployed"
              cp /tmp/graph.committed.json map/graph.json
            fi
          else
            echo "::warning::map crawl failed; the committed snapshot is deployed"
            cp /tmp/graph.committed.json map/graph.json
          fi

      - name: Rebuild the search index from the refreshed map (artifact only, never committed)
        # /inside/search.json merges the docs, the services and map/graph.json; rebuilt here so search matches the deployed map.
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/build_search.py

      - name: Apply the site chrome to pages written outside the build (artifact only, never committed)
        # The gate renders /conformity/ on every run without the shared chrome; scripts/site_chrome.py writes the top bar,
        # breadcrumbs and footer from site/nav.yml on every page, so a page a foreign generator rewrote still matches.
        continue-on-error: true
        timeout-minutes: 1
        run: python3 scripts/site_chrome.py --deploy

      - name: Snapshot the deploy feed for Inside (artifact only, never committed)
        # Inside reads /inside/deploys.json instead of calling the GitHub API from each visitor's browser.
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import datetime, json, os, urllib.error, urllib.request
          keep = ('name', 'status', 'conclusion', 'event', 'run_number', 'display_title', 'html_url', 'run_started_at', 'updated_at')
          out = {'generated': datetime.datetime.now(datetime.timezone.utc).strftime('%Y-%m-%dT%H:%M:%SZ'), 'repos': {}}
          for repo in ('uncovertechtalent/machinebehavior.io', 'uncovertechtalent/tychat.io'):
              url = f'https://api.github.com/repos/{repo}/actions/runs?per_page=15'
              for auth in (True, False):
                  h = {'Accept': 'application/vnd.github+json'}
                  if auth: h['Authorization'] = 'Bearer ' + os.environ['GH_TOKEN']
                  try:
                      runs = json.load(urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20))['workflow_runs']
                      out['repos'][repo] = [{k: r.get(k) for k in keep} for r in runs]
                      break
                  except (urllib.error.URLError, KeyError, ValueError) as e:
                      print(f'::warning::deploy feed for {repo} (auth={auth}) failed: {e}')
          json.dump(out, open('inside/deploys.json', 'w'), indent=1)
          print('deploy feed', {k: len(v) for k, v in out['repos'].items()})
          PY

      - name: Snapshot the issues for the board (artifact only, never committed)
        # /inside/board/ reads /inside/board/issues.json instead of calling the GitHub API from each visitor's browser.
        # No issues trigger on purpose: anyone can open an issue on a public repo, and each event would run the gate,
        # write a bot commit and redeploy. The board is as fresh as the last deploy; workflow_dispatch refreshes it.
        continue-on-error: true
        timeout-minutes: 2
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/board_snapshot.py inside/board/issues.json

      - name: Upload site
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  zizmor:
    name: Workflow security (zizmor)
    # Static analysis of .github (#65): template injection, permissions, credential persistence, pins.
    # It runs in this site's workflow only; the shared conformity action stays stdlib-only and offline.
    # The deploy does not wait for it. Accepted findings, each with a reason, are in .github/zizmor.yml.
    runs-on: ubuntu-latest
    permissions:
      contents: read    # check out the repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor (version and wheel hashes pinned in .github/zizmor/requirements.txt)
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor"
          "$RUNNER_TEMP/zizmor/bin/pip" install --require-hashes --no-deps --only-binary :all: -r .github/zizmor/requirements.txt

      - name: zizmor .github
        # Online audits (impostor commits, known-vulnerable actions, stale version comments) read the GitHub API with the job token.
        env:
          GH_TOKEN: ${{ github.token }}
        run: '"$RUNNER_TEMP/zizmor/bin/zizmor" --format github .github'
