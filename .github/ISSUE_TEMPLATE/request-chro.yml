# Request form for the chro seat (ADR-0052). The seven request forms differ only in name, description, and label.
name: "Request: Chief human resources officer"
description: "The chief human resources officer decides who does a piece of work, who learns it, which signal in the loop shows it, and who takes it over in writing."
labels:
  - "area:people"
body:
  - type: markdown
    attributes:
      value: "Issue text is public. Leave out private addresses, host names, personal and financial details. List prices, specs, and measured results are fine."
  - type: textarea
    id: what
    attributes:
      label: "What"
      description: "What is being asked for, in one paragraph."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why"
      description: "What happens if the house does nothing, with the numbers you have."
    validations:
      required: true
  - type: textarea
    id: blocked_on
    attributes:
      label: "Blocked on"
      description: "What has to happen first, and who decides it. Write none if nothing."
    validations:
      required: true
  - type: textarea
    id: done_when
    attributes:
      label: "Done when"
      description: "A result someone can check without asking the author."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: "Constraints"
      description: "Limits the answer has to respect."
    validations:
      required: false
  - type: dropdown
    id: kind
    attributes:
      label: "Kind"
      description: "A choice to make, work to do, or a gap found. A maintainer sets the matching label at triage."
      options:
        - "decision"
        - "action"
        - "finding"
    validations:
      required: true
  - type: checkboxes
    id: public
    attributes:
      label: "Public text"
      options:
        - label: "This text holds nothing private."
          required: true
