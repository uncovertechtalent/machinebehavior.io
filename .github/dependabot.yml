# Dependabot keeps the commit-SHA pins on GitHub Actions current: it moves the SHA and the
# version comment together. "/" covers .github/workflows; "/.github/actions/*" covers the
# composite conformity action. One group covers both directories, so at most one pull
# request each month, and it runs the Conformity checks like any other pull request.
# The pip entry keeps the zizmor pin in .github/zizmor/requirements.txt current, version and
# wheel hashes together; the npm entry keeps the Claude Code pin of the change-review workflow
# in .github/claude-code/package-lock.json current (#65). The cooldown waits 7 days after a release before proposing it,
# so a release that is pulled or found compromised in its first week never reaches a pull request.
version: 2
updates:
  - package-ecosystem: github-actions
    directories:
      - "/"
      - "/.github/actions/*"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - "*"
  - package-ecosystem: pip
    directory: "/.github/zizmor"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      zizmor:
        patterns:
          - "*"
  - package-ecosystem: npm
    directory: "/.github/claude-code"
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    groups:
      claude-code:
        patterns:
          - "*"
