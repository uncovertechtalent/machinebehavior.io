# One navigation source for machinebehavior.io.
#
# Sections and pages are defined here once. scripts/site_chrome.py reads this file and writes, on every page:
# the top bar, the breadcrumbs (visible, plus a JSON-LD BreadcrumbList), the section sidebar and the footer.
# It also checks sitemap.xml and llms.txt against this tree and reports pages outside it as orphans.
#
# Entries:
#   title  the name in the breadcrumbs and the sidebar
#   url    a root-absolute page path ending in /, or an anchor on a page (/inside/#dashboards)
#   group  a heading in the sidebar with pages under it; it has no page of its own and no breadcrumb
#   about  one sentence on a section or page, for the cards on the home page
#   auto   pages added by a build: docs (inside/docs/tree.json, written by scripts/build_docs.py),
#          services (inside/services/services.json, written by scripts/build_inside.py)
#          and topics (site/topics.yml; the hubs are built by scripts/build_hubs.py)
#   pages  the pages under an entry
#   published    the date a page gives itself as its publication date (JSON-LD datePublished); left out when it gives none
#   contributor  a model the page names as its writer or scorer (JSON-LD contributor)
#
# Rules: no URL changes (GitHub Pages has no redirects); a new page needs an entry here, in sitemap.xml and in llms.txt.

site:
  name: Machine Behavior
  owner: Stefan Coetzee
  base: https://machinebehavior.io
  repo: https://github.com/uncovertechtalent/machinebehavior.io
  search: /inside/search/
  # The author of every page, in the JSON-LD of every page (scripts/site_chrome.py page_ld, ADR-0027)
  person:
    name: Stefan Coetzee
    job_title: Site Reliability Engineer
    same_as:
      - https://www.linkedin.com/in/coetzeestefan/
      - https://coetzeestefan.substack.com/
      - https://github.com/uncovertechtalent
      - https://machinebehavior.io/
      - https://x.com/scoetzeede

# Impressum and privacy links go here as entries with title and url. Both wait on the business address (issues #10 and #11).
legal: []

# How the top bar shows the sections (scripts/site_chrome.py bar()). A group is one menu in the bar; its sections keep
# their own URLs, breadcrumbs and sidebars. The action is the conversion link: a button at the end of the bar, visible at
# every width. Below 900 px the sections sit in one Menu panel.
bar:
  groups:
    - title: Research
      sections: [research, red-team, aieo]
  action: cto

sections:
  - key: home
    title: Home
    url: /

  - key: research
    title: Research
    url: /research/
    about: The research programme in public. Claims with what would refute them, experiments with hashed predictions, registers, logs, case files, articles and reference texts.
    pages:
      - title: Claims ledger
        url: /claims/
      - title: Experiments
        url: /experiments/
      - title: Objections register
        url: /objections/
        published: 2026-05-16
      - title: Evidence index
        url: /evidence/
        published: 2026-10-07
      - title: Slips
        url: /slips/
      - group: Case files
        pages:
          - title: "Case 12: a licence rule mid-task"
            url: /case-12-licence-rule-mid-task/
            published: 2026-10-03
            contributor: Claude (Opus 5.5)
          - title: Running conjobs for AI
            url: /running-conjobs-for-ai/
            published: 2026-10-06
      - group: Articles
        pages:
          - title: The cheating moved
            url: /the-cheating-moved/
            published: 2026-09-29
          - title: Chaos engineering for behaviour
            url: /chaos-engineering-for-behaviour/
            published: 2026-10-03
      - group: Reference
        pages:
          - title: Man pages
            url: /man/
          - title: Terms
            url: /terms/
          - title: Continuous conformity
            url: /continuous-conformity/
            published: 2026-10-09
          - title: Self-assessment, run 1
            url: /continuous-conformity-self-assessment/
            published: 2026-10-03
            contributor: Claude (Opus 5.5)

  - key: red-team
    title: Red team
    url: /red-team/
    about: Psychological red-teaming of language models. Tests of whether a model drops a correct answer, a rule or a task boundary under social pressure alone, with a catalogue of tactics, the method of a run and the results so far.
    pages:
      - title: Tactics catalogue
        url: /red-team/tactics/
        published: 2026-10-09
      - title: How a run works
        url: /red-team/method/
        published: 2026-10-09

  - key: aieo
    title: AIEO
    url: /aieo/
    about: What the engines behind AI answers document about the pages they cite, how this site is built for AI search, and how citations get measured.
    pages:
      - title: This site
        url: /aieo/this-site/
        published: 2026-10-09
      - title: Measurement
        url: /aieo/measurement/
        published: 2026-10-09

  - key: inside
    title: Inside
    url: /inside/
    banner: true
    about: The portal behind the research. Services with owners and SLOs, a status page, the board, the tour and the tools that run the work.
    pages:
      - title: Mission Control
        url: /inside/mission-control/
        about: The live operations view. Gate and deploy state of the three sites, open incidents and the dashboards on one screen.
      - title: Services
        url: /inside/services/
        auto: services
      - title: Status
        url: /inside/status/
      - title: Board
        url: /inside/board/
      - title: Gate runs
        url: /conformity/
      - title: Tour
        url: /inside/tour/
      - title: Search
        url: /inside/search/

  - key: docs
    title: Docs
    url: /inside/docs/
    banner: true
    about: The documentation tree in six spaces. Engineering, observability, research, FinOps, an SRE handbook and standards, each page with an owner and a review date.
    auto: docs

  - key: topics
    title: Topics
    url: /topics/
    about: Hubs that gather one subject across research pages, Inside, the docs, posts and the board.
    auto: topics

  - key: map
    title: Map
    url: /map/
    about: Every page, post, repository and thread, and the links between them, as one graph.

  - key: cto
    title: CTO
    url: /your-next-cto/
    about: What Stefan Coetzee builds for a company of 10 to 200 people as a fractional CTO, the engagement shapes, how he hands the work over, and the live pages that show each part.
