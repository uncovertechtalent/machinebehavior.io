# One navigation source for machinebehavior.io.
#
# Sections and pages are defined here once. scripts/site_chrome.py reads this file and writes, on every page:
# the top bar, the breadcrumbs (visible, plus a JSON-LD BreadcrumbList), the section sidebar and the footer.
# It also checks sitemap.xml and llms.txt against this tree and reports pages outside it as orphans.
#
# Entries:
#   title  the name in the breadcrumbs and the sidebar
#   url    a root-absolute page path ending in /, or an anchor on a page (/inside/#dashboards)
#   group  a heading in the sidebar with pages under it; it has no page of its own and no breadcrumb. It holds one page,
#          the group's index, with the group's pages under it, or `include:` another section (ADR-0044, ADR-0045)
#   side   the sidebar's name for a page or an included section, when it differs from the title (All case files)
#   order  newest: its pages list newest first by `published`, in the sidebar, on its page and on the research index;
#          every one of them needs a date (YYYY-MM-DD). Without it they keep the order written here
#   hub    true: the page is a list of its pages, written by scripts/build_hubs.py (ADR-0045); research pages only
#   elsewhere  on a hub page with order newest: pieces that live on another site, listed on that page and on the research
#          index, merged by date with its pages. Each has title, url (its home, a host in ELSEWHERE_HOMES in scripts/site_chrome.py),
#          optional also (a copy on another such host), published (the piece's first publication, on whichever copy
#          came first) and about (ADR-0046)
#   about  one sentence on a section or page, for the cards on the home page
#   sections  on a page: parts of its own page that stand as studies of their own, listed on the research index as lines
#          (title, url = the page's URL with the heading's anchor, published), not in the sidebar (ADR-0048)
#   auto   pages added by a build: docs (inside/docs/tree.json, written by scripts/build_docs.py),
#          services (inside/services/services.json, written by scripts/build_inside.py),
#          topics (site/topics.yml; the hubs are built by scripts/build_hubs.py)
#          and powersuit (cto-powersuit/modules.json, written by scripts/build_powersuit.py from site/powersuit.yml)
#   pages  the pages under an entry
#   published    the date a page gives itself as its publication date (JSON-LD datePublished); left out when it gives none
#   contributor  a model the page names as its writer or scorer (JSON-LD contributor)
#   software     a page about one piece of software: name, description, repository, license, version, languages,
#                platform, alternate_name; written as a SoftwareSourceCode node, the page's main entity (JSON-LD, #85)
#
# Rules: a URL changes only with a redirect recorded in site/redirects.yml (ADR-0038); a new page needs an entry here, in sitemap.xml and in llms.txt.

site:
  name: Machine Behavior
  owner: Stefan Coetzee
  base: https://machinebehavior.io
  repo: https://github.com/uncovertechtalent/machinebehavior.io
  search: /inside/search/
  # The author of every page, in the JSON-LD of every page (scripts/site_chrome.py page_ld, ADR-0027)
  person:
    name: Stefan Coetzee
    job_title: Site Reliability Engineer
    same_as:
      - https://www.linkedin.com/in/coetzeestefan/
      - https://coetzeestefan.substack.com/
      - https://github.com/uncovertechtalent
      - https://machinebehavior.io/
      - https://x.com/scoetzeede

# The links in the legal line of every footer (scripts/site_chrome.py foot()): Impressum and privacy notice, issues #10 and #11.
legal:
  - title: Impressum
    url: /impressum/
  - title: Privacy
    url: /privacy/

# How the top bar shows the sections (scripts/site_chrome.py bar()). A group is one menu in the bar; its sections keep
# their own URLs, breadcrumbs and sidebars. A group may add `overview`: a section key whose hub page leads the menu,
# labelled "<title> overview", so the hub sits ahead of its leaves; a group without one lists only its `sections`.
# The action is the conversion link: a button at the end of the bar, visible at
# every width. Below 900 px the sections sit in one Menu panel.
bar:
  groups:
    - title: Research
      overview: research
      sections: [red-team]
    - title: More
      sections: [aieo, topics, map]
  action: cto

sections:
  - key: home
    title: Home
    url: /
    pages:
      - title: Impressum
        url: /impressum/
      - title: Privacy notice
        url: /privacy/

  - key: research
    title: Research
    url: /research/
    about: The research programme in public. Claims with what would refute them, experiments with hashed predictions, registers, logs, case files, articles and reference texts.
    door: "Claims with what would refute them, experiments with hashed predictions, case files."  # the one line on the front page (ADR-0041)
    pages:  # groups in reading order; each folds out in the sidebar, one at a time (ADR-0044)
      - group: Experiments
        pages:
          - title: Experiments
            url: /research/experiments/
            side: All experiments
            order: newest
            sections:  # the numbered studies on the page, each a line on the research index (ADR-0048)
              - title: The half-life study
                url: /research/experiments/#experiment-01
                published: 2026-08-07
              - title: Exemplar seeding
                url: /research/experiments/#experiment-02
                published: 2026-08-07
              - title: Cross-model fawn-opener benchmark (pre-registered, not yet run)
                url: /research/experiments/#experiment-03
                published: 2026-09-23
              - title: Folding under scripted pressure
                url: /research/experiments/#experiment-04
                published: 2026-10-07
            pages:
              - title: "Stance versus censorship: an abliteration probe"
                url: /research/experiments/stance-vs-censorship-abliteration/
                published: 2026-10-23
                contributor: Claude (Opus 4.8)
      - group: Case files
        pages:
          - title: Case files
            url: /research/case-files/
            side: All case files
            hub: true
            order: newest
            about: Single incidents, each written up from its record, with what the model and its harness did in order and which control was there or missing.
            pages:
              - title: "Case 12: a licence rule mid-task"
                url: /research/case-files/case-12-licence-rule-mid-task/
                published: 2026-10-03
                contributor: Claude (Opus 5.5)
              - title: Running conjobs for AI
                url: /research/case-files/running-conjobs-for-ai/
                published: 2026-10-06
      - group: Articles
        pages:
          - title: Articles
            url: /research/articles/
            side: All articles
            hub: true
            order: newest
            about: Longer arguments from the research programme, with their sources.
            elsewhere:  # research pieces that live on another site, listed on this index and on /research/ (ADR-0046, ADR-0048)
              - title: Knowledge Infrastructure for LLMs
                url: https://coetzeestefan.substack.com/p/knowledge-infrastructure-for-llms
                also: https://uncovertechtalent.com/blog/knowledge-infrastructure/
                published: 2026-10-03
                about: A language model can only work from what someone wrote down and put in front of it. Most companies that bought AI maintain their code and little else.
              - title: The Stance Layer Is Still Toil
                url: https://coetzeestefan.substack.com/p/the-stance-layer-is-still-toil
                also: https://uncovertechtalent.com/blog/the-stance-layer-is-still-toil/
                published: 2026-10-01
                about: A hook can block a word on every reply. Nothing I run can yet catch a model before it folds, only after.
              - title: An RCA on Claudish
                url: https://coetzeestefan.substack.com/p/an-rca-on-claudish
                also: https://uncovertechtalent.com/blog/where-did-claudish-come-from/
                published: 2026-09-29
                about: "Where Claude's writing style came from: text written to be heard, read in silence."
              - title: "Which LLM User Are We Talking About?"
                url: https://coetzeestefan.substack.com/p/which-llm-user-are-we-talking-about
                also: https://uncovertechtalent.com/blog/which-llm-user/
                published: 2026-09-29
                about: Advice about language models depends on which model, on whose hardware, inside how much harness.
              - title: Compaction Is the New OOM
                url: https://coetzeestefan.substack.com/p/compaction-is-the-new-oom
                also: https://uncovertechtalent.com/blog/compaction-is-the-new-oom/
                published: 2026-09-28
                about: Most agent harnesses ship without swap.
              - title: What Operations Already Knows About Running Agents
                url: https://coetzeestefan.substack.com/p/what-operations-already-knows-about
                also: https://uncovertechtalent.com/blog/what-operations-already-knows/
                published: 2026-09-25
                about: "Error budgets, reconciliation loops, separation of duties and recovery over prevention: four operations practices that fit agent work almost line for line."
              - title: Write for the Codec
                url: https://coetzeestefan.substack.com/p/write-for-the-codec
                also: https://uncovertechtalent.com/blog/write-for-the-codec/
                published: 2026-09-21
                about: Nobody reads your documentation. Both ends are a model now, and the file between them is a wire format.
              - title: The Golem Made of English and the Horizon of Consequences
                url: https://coetzeestefan.substack.com/p/the-golem-made-of-english-and-the
                also: https://uncovertechtalent.com/blog/the-golem-made-of-english/
                published: 2026-09-21
                about: A language model is a golem made of English. It behaves well only where it can see what its act will cost, and infrastructure is the craft of bringing that cost into view.
              - title: The Trap File Is Longer Than the Instruction File
                url: https://coetzeestefan.substack.com/p/the-trap-file-is-longer-than-the
                also: https://uncovertechtalent.com/blog/the-trap-file-is-longer-than-the-instruction-file/
                published: 2026-09-21
                about: Seven months of running an agent-built pipeline unattended, 308 lines of recorded failures next to 208 lines of instructions.
              - title: Sycophancy Is Layered
                url: https://coetzeestefan.substack.com/p/sycophancy-is-layered-symptom-substitution
                published: 2026-07-31
                about: A longitudinal single-user case study, with operationalized artifacts.
            pages:
              - title: The cheating moved
                url: /research/articles/the-cheating-moved/
                published: 2026-09-29
              - title: Chaos engineering for behaviour
                url: /research/articles/chaos-engineering-for-behaviour/
                published: 2026-10-03
      - group: Red team
        include: red-team  # the red-team section's overview and pages; its pages show this sidebar
      - group: Registers
        pages:
          - title: Registers
            url: /research/registers/
            side: All registers
            hub: true
            about: The lists the programme keeps current, with claims and what would refute them, the objections, the evidence and the slips.
            pages:
              - title: Claims ledger
                url: /research/claims/
              - title: Objections register
                url: /research/objections/
                published: 2026-05-16
              - title: Evidence index
                url: /research/evidence/
                published: 2026-10-07
              - title: Slips
                url: /research/slips/
      - group: Reference
        pages:
          - title: Reference
            url: /research/reference/
            side: All reference texts
            hub: true
            about: Terms, man pages and topics for reading the research.
            pages:
              - title: Terms
                url: /research/terms/
              - title: Man pages
                url: /man/
              - link: Topics  # a sidebar link, not a page of this section
                url: /topics/
  - key: red-team
    title: Red team
    url: /research/red-team/
    about: Psychological red-teaming of language models. Tests of whether a model drops a correct answer, a rule or a task boundary under social pressure alone, with a catalogue of tactics, the method of a run and the results so far.
    door: "Whether a model drops a correct answer under social pressure alone."  # the one line on the front page (ADR-0041)
    side: All red-team pages  # its name in the research sidebar, which includes it
    order: newest
    sections:  # a line on the research index (ADR-0048)
      - title: Weekly decision-layer probe
        url: /research/red-team/#what-has-run
        published: 2026-10-07
    pages:
      - title: Tactics catalogue
        url: /research/red-team/tactics/
        published: 2026-10-09
      - title: How a run works
        url: /research/red-team/method/
        published: 2026-10-09

  - key: conformity
    title: Conformity
    url: /conformity/
    about: Continuous conformity of this site. The gate runs on every push and publishes an OSCAL-shaped record; the working-draft standard and the self-assessment sit here as its reference.
    pages:
      - title: The standard
        url: /conformity/standard/
        published: 2026-10-09
        pages:
          - title: Why test the running system
            url: /conformity/standard/why-test-the-running-system/
          - title: The six-month problem
            url: /conformity/standard/the-six-month-problem/
      - title: Self-assessment, run 1
        url: /conformity/self-assessment/
        published: 2026-10-03
        contributor: Claude (Opus 5.5)

  - key: inside
    title: Inside
    url: /inside/
    banner: true
    about: The portal behind the research. Services with owners and SLOs, a status page, the board, the tour and the tools that run the work.
    door: "The portal behind the research: services, status, the board and Mission Control."  # the one line on the front page (ADR-0041)
    pages:
      - title: Mission Control
        url: /inside/mission-control/
        about: The live operations view. Gate and deploy state of the three sites, open incidents and the dashboards on one screen.
      - title: Cockpit
        url: /inside/cockpit/
