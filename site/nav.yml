# One navigation source for machinebehavior.io.
#
# Sections and pages are defined here once. scripts/site_chrome.py reads this file and writes, on every page:
# the top bar, the breadcrumbs (visible, plus a JSON-LD BreadcrumbList), the section sidebar and the footer.
# It also checks sitemap.xml and llms.txt against this tree and reports pages outside it as orphans.
#
# Entries:
#   title  the name in the breadcrumbs and the sidebar
#   url    a root-absolute page path ending in /, or an anchor on a page (/inside/#dashboards)
#   group  a heading in the sidebar with pages under it; it has no page of its own and no breadcrumb
#   about  one sentence on a section or page, for the cards on the home page
#   auto   pages added by a build: docs (inside/docs/tree.json, written by scripts/build_docs.py),
#          services (inside/services/services.json, written by scripts/build_inside.py),
#          topics (site/topics.yml; the hubs are built by scripts/build_hubs.py)
#          and powersuit (cto-powersuit/modules.json, written by scripts/build_powersuit.py from site/powersuit.yml)
#   pages  the pages under an entry
#   published    the date a page gives itself as its publication date (JSON-LD datePublished); left out when it gives none
#   contributor  a model the page names as its writer or scorer (JSON-LD contributor)
#   software     a page about one piece of software: name, description, repository, license, version, languages,
#                platform, alternate_name; written as a SoftwareSourceCode node, the page's main entity (JSON-LD, #85)
#
# Rules: a URL changes only with a redirect recorded in site/redirects.yml (ADR-0038); a new page needs an entry here, in sitemap.xml and in llms.txt.

site:
  name: Machine Behavior
  owner: Stefan Coetzee
  base: https://machinebehavior.io
  repo: https://github.com/uncovertechtalent/machinebehavior.io
  search: /inside/search/
  # The author of every page, in the JSON-LD of every page (scripts/site_chrome.py page_ld, ADR-0027)
  person:
    name: Stefan Coetzee
    job_title: Site Reliability Engineer
    same_as:
      - https://www.linkedin.com/in/coetzeestefan/
      - https://coetzeestefan.substack.com/
      - https://github.com/uncovertechtalent
      - https://machinebehavior.io/
      - https://x.com/scoetzeede

# The links in the legal line of every footer (scripts/site_chrome.py foot()): Impressum and privacy notice, issues #10 and #11.
legal:
  - title: Impressum
    url: /impressum/
  - title: Privacy
    url: /privacy/

# How the top bar shows the sections (scripts/site_chrome.py bar()). A group is one menu in the bar; its sections keep
# their own URLs, breadcrumbs and sidebars. A group may add `overview`: a section key whose hub page leads the menu,
# labelled "<title> overview", so the hub sits ahead of its leaves; a group without one lists only its `sections`.
# The action is the conversion link: a button at the end of the bar, visible at
# every width. Below 900 px the sections sit in one Menu panel.
bar:
  groups:
    - title: Research
      overview: research
      sections: [red-team]
    - title: More
      sections: [aieo, topics, map]
  action: cto

sections:
  - key: home
    title: Home
    url: /
    pages:
      - title: Impressum
        url: /impressum/
      - title: Privacy notice
        url: /privacy/

  - key: research
    title: Research
    url: /research/
    about: The research programme in public. Claims with what would refute them, experiments with hashed predictions, registers, logs, case files, articles and reference texts.
    door: "Claims with what would refute them, experiments with hashed predictions, case files."  # the one line on the front page (ADR-0041)
    pages:
      - title: Claims ledger
        url: /research/claims/
      - title: Experiments
        url: /research/experiments/
        pages:
          - title: "Stance versus censorship: an abliteration probe"
            url: /research/experiments/stance-vs-censorship-abliteration/
            published: 2026-10-23
            contributor: Claude (Opus 4.8)
      - title: Objections register
        url: /research/objections/
        published: 2026-05-16
      - title: Evidence index
        url: /research/evidence/
        published: 2026-10-07
      - title: Slips
        url: /research/slips/
      - group: Case files
        pages:
          - title: "Case 12: a licence rule mid-task"
            url: /research/case-files/case-12-licence-rule-mid-task/
            published: 2026-10-03
            contributor: Claude (Opus 5.5)
          - title: Running conjobs for AI
            url: /research/case-files/running-conjobs-for-ai/
            published: 2026-10-06
      - group: Articles
        pages:
          - title: The cheating moved
            url: /research/articles/the-cheating-moved/
            published: 2026-09-29
          - title: Chaos engineering for behaviour
            url: /research/articles/chaos-engineering-for-behaviour/
            published: 2026-10-03
      - group: Reference
        pages:
          - title: Man pages
            url: /man/
          - title: Terms
            url: /research/terms/

  - key: red-team
    title: Red team
    url: /research/red-team/
    about: Psychological red-teaming of language models. Tests of whether a model drops a correct answer, a rule or a task boundary under social pressure alone, with a catalogue of tactics, the method of a run and the results so far.
    door: "Whether a model drops a correct answer under social pressure alone."  # the one line on the front page (ADR-0041)
    pages:
      - title: Tactics catalogue
        url: /research/red-team/tactics/
        published: 2026-10-09
      - title: How a run works
        url: /research/red-team/method/
        published: 2026-10-09

  - key: conformity
    title: Conformity
    url: /conformity/
    about: Continuous conformity of this site. The gate runs on every push and publishes an OSCAL-shaped record; the working-draft standard and the self-assessment sit here as its reference.
    pages:
      - title: The standard
        url: /conformity/standard/
        published: 2026-10-09
        pages:
          - title: Why test the running system
            url: /conformity/standard/why-test-the-running-system/
          - title: The six-month problem
            url: /conformity/standard/the-six-month-problem/
      - title: Self-assessment, run 1
        url: /conformity/self-assessment/
        published: 2026-10-03
        contributor: Claude (Opus 5.5)

  - key: inside
    title: Inside
    url: /inside/
    banner: true
    about: The portal behind the research. Services with owners and SLOs, a status page, the board, the tour and the tools that run the work.
    door: "The portal behind the research: services, status, the board and Mission Control."  # the one line on the front page (ADR-0041)
    pages:
      - title: Mission Control
        url: /inside/mission-control/
        about: The live operations view. Gate and deploy state of the three sites, open incidents and the dashboards on one screen.
      - title: Cockpit
        url: /inside/cockpit/
        about: The CTO powersuit cockpit on the public work. Issues of the public repositories by area of the CTO job, with a scorecard per area.
      - title: Masthead
        url: /inside/masthead/
        about: The seats of the house, who holds each, the machinery that runs its staff work, the gates that apply, a tab per seat with its lens and the cockpit's panels for its areas, and the editorial standards.
      - title: Services
        url: /inside/services/
        auto: services
      - title: Status
        url: /inside/status/
      - title: Board
        url: /inside/board/
      - title: Tour
        url: /inside/tour/
      - title: Search
        url: /inside/search/

  - key: docs
    title: Docs
    url: /inside/docs/
    banner: true
    about: The documentation tree in six spaces. Engineering, observability, research, FinOps, an SRE handbook and standards, each page with an owner and a review date.
    door: "The documentation tree, with an owner and a review date on every page."  # the one line on the front page (ADR-0041)
    auto: docs

  - key: aieo
    title: AIEO
    url: /aieo/
    about: What the engines behind AI answers document about the pages they cite, how this site is built for AI search, and how citations get measured.
    pages:
      - title: This site
        url: /aieo/this-site/
        published: 2026-10-09
      - title: Measurement
        url: /aieo/measurement/
        published: 2026-10-09

  - key: topics
    title: Topics
    url: /topics/
    about: Hubs that gather one subject across research pages, Inside, the docs, posts and the board.
    door: "One subject gathered across research, Inside, the docs and posts."  # the one line on the front page (ADR-0041)
    auto: topics

  - key: map
    title: Second brain
    url: /map/
    about: "The public part of Stefan Coetzee's second brain: every page, post, repository and thread, and the links between them, as one graph."

  - key: cto
    title: CTO
    url: /your-next-cto/
    about: What Stefan Coetzee builds for a company of 10 to 200 people as a fractional CTO, the engagement shapes, the CTO powersuit, and the live pages that show each part.
    door: "Fractional CTO for companies of 10 to 200 people, with the CTO powersuit."  # the one line on the front page (ADR-0041)
    pages:
      - title: CTO powersuit
        url: /cto-powersuit/
        published: 2026-10-13
        auto: powersuit
        software:
          name: CTO powersuit
          alternate_name: cto-powersuit
          description: "The CTO powersuit is a set of agent skills, one module per CTO function from the deploy gate to the hand-over, that one person uses to run a company's whole engineering platform."
          repository: https://github.com/uncovertechtalent/cto-powersuit
          languages: [Python, JavaScript, Shell]
          platform: Claude Code
      - title: The CTO powersuit experiment
        url: /your-next-cto/experiment/
        published: 2026-10-09
