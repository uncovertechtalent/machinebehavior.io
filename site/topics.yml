# Topic hubs at /topics/<key>/, built by scripts/build_hubs.py.
#
# A hub lists everything tagged with its topic across the site and beyond it:
#   pages         hand-written pages and Inside pages (the tag map for pages without front matter)
#   docs_labels   docs pages whose front matter carries one of these labels
#   docs_spaces   whole docs spaces
#   map_tags      uncovertechtalent.com tag pages on the map; the posts they list belong to the topic
#   post_words    words in the title of a Substack post (cross-posts are listed once)
#   ticket_labels board issues with one of these labels
#   ticket_words  words in the title of a board issue
# Words match the start of a word, without case.

